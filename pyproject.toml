[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "yt-rec"
version = "0.0.0"
description = "선택한 YouTube 채널의 라이브를 시작 지점부터 자동 녹화하는 데스크톱 앱"
requires-python = ">=3.11"
dependencies = [
    # Widgets + YouTube의 네이티브 웹 푸시를 받는 앱 전용 Chromium 프로필.
    "PySide6>=6.11.1,<7",
    # Google 공식 OAuth 2.0. 시스템 기본 브라우저 + 로컬 루프백.
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
]

# 평소 실행용. GUI 스크립트는 pythonw 로 서는 런처를 만든다. 콘솔 스크립트로 두면
# Windows 가 실행할 때마다 빈 터미널 창을 붙인다(#96).
[project.gui-scripts]
yt-rec = "yt_rec.app:main"

# 같은 진입점의 콘솔용. `--help` 와 `--smoke-test` 는 표준출력으로 결과를 내므로
# 콘솔이 붙는 런처가 따로 있어야 그 출력을 볼 수 있다.
[project.scripts]
yt-rec-console = "yt_rec.app:main"

# 개발용 의존성. 런타임 의존성과 분리해 배포물에 들어가지 않게 한다.
# `uv sync` 가 기본으로 함께 설치하고, 배포용 설치에는 `--no-dev` 를 쓴다.
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "yt_rec"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: 실제 yt-dlp/ffmpeg 를 돌리는 테스트. 바이너리가 없으면 건너뛴다",
    "slow: 수십 초가 걸리는 테스트",
]
